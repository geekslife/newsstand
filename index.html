---
layout: default
---
<section class="intro">
  <p>믿을 뉴스는 <strong>누가 옳은지 말하지 않습니다.</strong> 판이 어디로 기울고 있는지 지켜볼 뿐입니다.</p>
</section>

<section class="posts">
  <h2>판세</h2>
  <ul>
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
