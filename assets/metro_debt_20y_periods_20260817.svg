<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">20년으로 넓히자 진영 격차는 시기에 따라 뒤집혔습니다</title>
  <desc id="desc">민주계와 보수계 단체장 재임기의 연평균 채무 증가율 격차입니다. 2005년부터 2014년은 민주계가 1.1퍼센트포인트 낮았고, 2015년부터 2024년은 6.7퍼센트포인트 높았습니다. 20년 전체는 3.4퍼센트포인트, 전년도 단체장에게 귀속하면 5.6퍼센트포인트 높았습니다.</desc>
  <rect width="1200" height="630" fill="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Pretendard, Malgun Gothic, sans-serif" fill="#1a1a1a">
    <text x="60" y="72" font-size="43" font-weight="700">20년으로 넓히자, 진영 격차는 시기에 따라 뒤집혔습니다</text>
    <text x="60" y="114" font-size="23" fill="#6b6b6b">민주계 − 보수계 연평균 채무 증가율 격차 · 단순 평균</text>

    <rect x="390" y="157" width="730" height="340" fill="none" stroke="#dededb" stroke-width="2"/>
    <g stroke="#e6e6e6" stroke-width="2">
      <line x1="512" y1="157" x2="512" y2="497"/>
      <line x1="756" y1="157" x2="756" y2="497"/>
      <line x1="878" y1="157" x2="878" y2="497"/>
      <line x1="1000" y1="157" x2="1000" y2="497"/>
    </g>
    <line x1="634" y1="157" x2="634" y2="497" stroke="#1a1a1a" stroke-width="3"/>

    <g font-size="24">
      <text x="365" y="220" text-anchor="end">2005–2014</text>
      <text x="365" y="300" text-anchor="end">2015–2024</text>
      <text x="365" y="380" text-anchor="end" font-weight="700">2005–2024</text>
      <text x="365" y="460" text-anchor="end">20년 · 1년 시차</text>
    </g>

    <rect x="607" y="191" width="27" height="42" fill="#d85858"/>
    <rect x="634" y="271" width="163" height="42" fill="#2a78d6"/>
    <rect x="634" y="351" width="84" height="42" fill="#2a78d6"/>
    <rect x="634" y="431" width="137" height="42" fill="#2a78d6" opacity="0.66"/>

    <g font-size="25" font-weight="700">
      <text x="593" y="222" text-anchor="end" fill="#b43e3e">−1.1%p</text>
      <text x="811" y="302" fill="#205ea8">+6.7%p</text>
      <text x="732" y="382" fill="#205ea8">+3.4%p</text>
      <text x="785" y="462" fill="#205ea8">+5.6%p</text>
    </g>

    <g font-size="19" fill="#4f4f4f" text-anchor="middle">
      <text x="390" y="530">−10</text>
      <text x="512" y="530">−5</text>
      <text x="634" y="530">0</text>
      <text x="756" y="530">+5</text>
      <text x="878" y="530">+10</text>
      <text x="1000" y="530">+15</text>
      <text x="1120" y="530">+20</text>
    </g>
    <text x="756" y="570" font-size="21" text-anchor="middle">양수는 민주계, 음수는 보수계의 증가율이 더 높다는 뜻입니다</text>
    <text x="60" y="610" font-size="17" fill="#6b6b6b">행정안전부·e-나라지표 시도별 합계(시군구 포함) · 부산 2020년, 대전 2005년 등 모호한 귀속 제외</text>
  </g>
</svg>
